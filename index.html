<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neverlose — Панель управления</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .panel {
            max-width: 480px;
            width: 100%;
            background: rgba(14, 14, 22, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 3.2rem 2.5rem 2.5rem;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 50, 50, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        .panel:hover {
            border-color: rgba(255, 50, 50, 0.2);
        }
        .panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 20%, rgba(255, 50, 50, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Neverlose стиль — сине-красный градиент */
        .title {
            font-size: 3.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ff3b3b 0%, #3b8bff 50%, #ff3b3b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            line-height: 1.1;
            padding-top: 8px;
            filter: drop-shadow(0 0 40px rgba(255, 50, 50, 0.08));
        }

        .subtitle {
            color: #666688;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 50, 50, 0.05);
            padding-bottom: 1.2rem;
            font-weight: 300;
        }

        /* Кнопка Google — с сине-красным акцентом */
        .btn-google {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid rgba(255, 50, 50, 0.1);
            border-radius: 60px;
            background: rgba(255, 50, 50, 0.03);
            color: #e8e8f0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-google:hover {
            background: rgba(255, 50, 50, 0.06);
            border-color: #ff3b3b;
            box-shadow: 0 0 30px rgba(255, 50, 50, 0.08);
        }
        .btn-google svg { width: 24px; height: 24px; }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: #555577;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 50, 50, 0.06);
        }

        /* Скрываем логин-форму */
        .login-form { display: none; flex-direction: column; gap: 0.8rem; }
        .login-form input { display: none; }
        .btn-login { display: none; }

        /* Анимация загрузки (оставляем для красоты) */
        .loader { display: none; justify-content: center; align-items: center; gap: 12px; margin: 1.5rem 0; }
        .loader.active { display: flex; }
        .loader .dot {
            width: 14px; height: 14px; border-radius: 50%;
            background: linear-gradient(135deg, #ff3b3b, #3b8bff);
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loader .dot:nth-child(1) { animation-delay: -0.32s; }
        .loader .dot:nth-child(2) { animation-delay: -0.16s; }
        .loader .dot:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Дашборд — в стиле Neverlose */
        .dashboard {
            display: none;
            flex-direction: column;
            gap: 1.2rem;
            animation: fadeIn 0.6s ease;
        }
        .dashboard.active { display: flex; }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .status-card {
            background: rgba(255, 50, 50, 0.02);
            border-radius: 24px;
            padding: 1rem;
            border: 1px solid rgba(255, 50, 50, 0.05);
            transition: border-color 0.3s;
        }
        .status-card:hover {
            border-color: rgba(255, 50, 50, 0.15);
        }
        .status-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666688;
        }
        .status-card .value {
            font-weight: 700;
            font-size: 1.1rem;
            color: #e8e8f0;
        }
        .status-card .value.green { color: #22c55e; }
        .status-card .value.orange { color: #ff8c42; }
        .status-card .value.neon-red { color: #ff3b3b; }

        /* Кнопка скачивания — сине-красная */
        .btn-download {
            background: rgba(255, 50, 50, 0.04);
            border: 1px solid rgba(255, 50, 50, 0.08);
            border-radius: 60px;
            padding: 0.7rem 1.8rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #aaaacc;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            justify-content: center;
        }
        .btn-download:hover {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.2);
            color: #e8e8f0;
            box-shadow: 0 0 30px rgba(255, 50, 50, 0.04);
        }
        .btn-download svg {
            width: 18px; height: 18px;
            fill: none; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .subscription {
            font-size: 0.75rem;
            color: #555577;
            border-top: 1px solid rgba(255, 50, 50, 0.04);
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
        }
        .subscription .highlight { color: #ff3b3b; font-weight: 500; }
        .subscription .green { color: #22c55e; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .panel { padding: 2rem 1.5rem; }
            .title { font-size: 2.8rem; }
            .status-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="panel">
    <div class="title">Neverlose</div>
    <div class="subtitle">Панель управления</div>

    <button class="btn-google" id="googleLoginBtn">
        <svg viewBox="0 0 24 24"><path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Войти через Google
    </button>

    <div class="divider">или через логин</div>

    <!-- Форма логина скрыта, оставлена для совместимости -->
    <div class="login-form" id="loginForm">
        <input type="text" id="loginInput" placeholder="Логин" autocomplete="username">
        <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="current-password">
        <button class="btn-login" id="loginBtn">Войти</button>
    </div>

    <div class="loader" id="loader">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="status-grid">
            <div class="status-card">
                <div class="label">Аккаунт</div>
                <div class="value neon-red" id="statusUser">Guss зафикси</div>
            </div>
            <div class="status-card">
                <div class="label">Срок подписки</div>
                <div class="value orange" id="expiryDate">до 01.01.2026</div>
            </div>
        </div>

        <button class="btn-download" id="downloadBtn">
            <svg viewBox="0 0 24 24">
                <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
                <polyline points="8 12 12 16 16 12"/>
                <line x1="12" y1="2" x2="12" y2="16"/>
            </svg>
            Скачать лаунчер
        </button>

        <div class="subscription">
            <span>Статус: <span class="green">Активна</span></span>
            <span><span class="highlight" id="expiryText">до 09.01.2026</span></span>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // 1. GOOGLE OAUTH (токены те же)
        // ============================================================

        const CLIENT_ID = '849190665927-1ch46i0nv2ri7hj37qncp1fjd13vdeld.apps.googleusercontent.com';
        const REDIRECT_URI = 'https://nafigatieto720-bit.github.io/fatalityz/';

        function signInWithGoogle() {
            const googleAuthUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
                'client_id=' + CLIENT_ID +
                '&redirect_uri=' + REDIRECT_URI +
                '&response_type=token' +
                '&scope=email profile';
            window.location.href = googleAuthUrl;
        }

        function handleGoogleCallback() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                if (accessToken) {
                    fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                        headers: { 'Authorization': 'Bearer ' + accessToken }
                    })
                    .then(res => res.json())
                    .then(data => {
                        // Скрываем кнопку Google
                        document.getElementById('googleLoginBtn').style.display = 'none';
                        document.querySelector('.divider').style.display = 'none';
                        // Показываем дашборд
                        document.getElementById('dashboard').classList.add('active');
                        // Устанавливаем имя пользователя
                        const userName = data.name || 'Guss зафикси';
                        document.getElementById('statusUser').textContent = userName;
                    })
                    .catch(err => {
                        alert('❌ Ошибка входа через Google!');
                        console.error(err);
                    });
                }
            }
        }

        document.getElementById('googleLoginBtn').addEventListener('click', signInWithGoogle);
        handleGoogleCallback();

        // ============================================================
        // 2. НАСТРОЙКИ ДАТЫ И ССЫЛКИ
        // ============================================================

        const expiryText = document.getElementById('expiryText');
        const expiryDate = document.getElementById('expiryDate');

        function setExpiryDate() {
            const now = new Date();
            const expiry = new Date(now.getFullYear() + 1, now.getMonth(), now.getDate());
            const formatted = expiry.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
            expiryText.textContent = 'до ' + formatted;
            if (expiryDate) expiryDate.textContent = 'до ' + formatted;
        }
        setExpiryDate();

        // ============================================================
        // 3. ССЫЛКА НА СКАЧИВАНИЕ
        // ============================================================

        const downloadBtn = document.getElementById('downloadBtn');
        const LAUNCHER_URL = 'https://github.com/nafigatieto720-bit/fatality/releases/download/v1.0/Loader.exe';

        downloadBtn.addEventListener('click', function(e) {
            e.preventDefault();
            try {
                const a = document.createElement('a');
                a.href = LAUNCHER_URL;
                a.download = 'Loader.exe';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (err) {
                alert('⚠️ Ссылка на лаунчер временно недоступна.');
                console.error('Download error:', err);
            }
        });

        // ============================================================
        // 4. КОНСОЛЬ
        // ============================================================

        console.log('🔗 CLIENT_ID:', CLIENT_ID);
        console.log('✅ Neverlose Panel loaded');
        console.log('📦 Launcher URL:', LAUNCHER_URL);

    })();
</script>

</body>
</html>
